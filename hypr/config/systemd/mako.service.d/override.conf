# Restrict mako to Hyprland sessions.
#
# mako ships /usr/share/dbus-1/services/fr.emersion.mako.service, which claims
# org.freedesktop.Notifications on D-Bus activation. The vendor unit only checks
# $WAYLAND_DISPLAY, which is also set in a KDE Plasma Wayland session, so mako
# wins the name there before plasmashell can and KDE ends up with no notification
# daemon ("Notifications are currently provided by 'emersion mako'").
#
# Replacing ExecCondition keeps mako auto-starting on Hyprland (and any other
# compositor that sets HYPRLAND_INSTANCE_SIGNATURE) while leaving Plasma alone.

[Service]
ExecCondition=
ExecCondition=/bin/sh -c '[ -n "$HYPRLAND_INSTANCE_SIGNATURE" ] || [ "$XDG_CURRENT_DESKTOP" = "Hyprland" ]'
