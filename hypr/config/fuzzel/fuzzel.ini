# fuzzel — zinc launcher.
#
# A single rounded card: 16px radius, 1px hairline border, translucent dark
# surface that picks up the Hyprland layer blur behind it.
#
# Spacing is deliberately generous. The previous values (line-height 22,
# vertical-pad 14, inner-pad 8) packed rows so tightly that icons crowded the
# text and the whole card read as a dense list rather than a launcher.
#
# `namespace` must stay `fuzzel`: fuzzel reports "launcher" by default, and the
# blur layer rule in modules/rules.lua matches on the namespace. Without this
# line the launcher was never actually blurred.

[main]
namespace=fuzzel
font=Inter Variable:size=12
dpi-aware=no
prompt=""
placeholder=Search applications…
icons-enabled=yes
icon-theme=Fluent
terminal=kitty
lines=11
width=46
tabs=4
horizontal-pad=22
vertical-pad=18
inner-pad=10
line-height=36
letter-spacing=0.1
image-size-ratio=0.40
match-mode=fzf
fields=name,generic,keywords,categories,comment

[border]
width=1
radius=16
selection-radius=11

[colors]
background=0e0e11d9
text=8b8b96ff
prompt=52525bff
placeholder=52525bff
input=fafafaff
match=7dd3fcff
selection=ffffff14
selection-text=fafafaff
selection-match=7dd3fcff
counter=52525bff
border=ffffff14

[dmenu]
exit-immediately-if-empty=yes
