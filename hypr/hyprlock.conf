# hyprlock — shadcn/zinc lock screen.
#
# hyprlock still reads hyprlang (not Lua). Colours are literal values: the old
# file referenced $color0/$color6/$color7, which are Hyprland theme variables
# and are *not* available here, so every one of those fields was empty.

$background = ~/.local/share/backgrounds

general {
    hide_cursor = true
    grace = 0
}

animations {
    enabled = true
    bezier = easeOut, 0.22, 1, 0.36, 1
    animation = fadeIn, 1, 5, easeOut
    animation = fadeOut, 1, 5, easeOut
    animation = inputFieldDots, 1, 2, easeOut
}

background {
    monitor =
    path = $background/wallpaper-lock
    blur_size = 6
    blur_passes = 2
    noise = 0.02
    contrast = 1.1
    brightness = 0.45
    vibrancy = 0.15
}

# Clock
label {
    monitor =
    text = $TIME
    color = rgba(244, 244, 245, 1.0)
    font_size = 76
    font_family = Inter
    font_weight = 600

    position = 0, 120
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %-d %B"
    color = rgba(161, 161, 170, 1.0)
    font_size = 18
    font_family = Inter

    position = 0, 48
    halign = center
    valign = center
}

# Greeting
label {
    monitor =
    text = $USER
    color = rgba(161, 161, 170, 1.0)
    font_size = 14
    font_family = Inter

    position = 0, 220
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 46
    outline_thickness = 1
    rounding = 12
    dots_size = 0.22
    dots_spacing = 0.5
    dots_center = true

    inner_color = rgba(24, 24, 27, 0.85)
    outer_color = rgba(255, 255, 255, 0.10)
    check_color = rgba(244, 244, 245, 0.85)
    fail_color = rgba(252, 165, 165, 0.95)

    font_color = rgba(244, 244, 245, 1.0)
    font_family = Inter

    fade_on_empty = false
    placeholder_text = <span alpha="60%">Password</span>
    fail_text = <span color="#fca5a5">Incorrect · $ATTEMPTS</span>
    hide_input = false

    position = 0, -60
    halign = center
    valign = bottom
}
