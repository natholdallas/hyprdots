$background = ~/.local/share/backgrounds

# hyprpaper still uses hyprlang. The IPC socket is needed by scripts/wallpaper.sh
# so the wallpaper can be rotated at runtime.
preload = $background/wallpaper
wallpaper = ,$background/wallpaper

# Splash text on startup is pure overhead; the bar and wallpaper are enough.
splash = false

ipc = on
